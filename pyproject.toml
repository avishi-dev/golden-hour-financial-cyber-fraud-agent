[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-hour"
version = "0.1.0"
description = "ASI:One and Fetch.ai uAgents financial fraud first-response coordinator"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1.0,<2", "uagents>=0.25.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
golden-hour = "golden_hour.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
